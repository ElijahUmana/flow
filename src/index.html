<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; font-src 'self' data:; connect-src 'self'">
<title>Flow</title>
<link rel="stylesheet" href="vendor/xterm/xterm.css">
<link rel="stylesheet" href="app.css"><link rel="stylesheet" href="term.css"><link rel="stylesheet" href="page.css"><link rel="stylesheet" href="sidebar.css"><link rel="stylesheet" href="files.css"><link rel="stylesheet" href="wsbg.css"><link rel="stylesheet" href="notes.css">
</head>
<body>
<div class="app">
  <aside class="sb" id="sb">
    <div class="sb-in">
      <div class="sb-top"><input class="sb-search" id="q" placeholder="search  (⌘K)" spellcheck="false" autocomplete="off"></div>
      <div class="sb-list" id="sblist"></div>
      <div class="sb-foot"><button id="collapse" title="hide the sidebar (⌘\)">‹</button></div>
    </div>
  </aside>
  <button class="expand" id="expand" title="show the sidebar (⌘\)">›</button>
  <main class="stage" id="stage">
    <div class="menubar">
      <nav class="spaces" id="spaces"></nav>
      <div class="mb-right">
      </div>
    </div>
    <div class="viewport" id="viewport">
      <div class="track" id="track"></div>
      <div class="edge l" id="edgeL"></div>
      <div class="edge r" id="edgeR"></div>
    </div>
    <div class="dock" id="dock">
      <button data-k="agent">›_<span>new agent</span></button>
      <button data-k="shell">$_<span>new shell</span></button>
      <button data-k="team">◫<span>new team</span></button>
      <button data-k="note">✎<span>new note</span></button>
      <button data-k="page">↗<span>new page</span></button>
      <button data-k="zone">◳<span>new sub-workspace</span></button>
      <button data-k="arrange">▦<span>arrange</span></button>
    </div>
    <div class="toast" id="toast"></div>
  </main>
</div>
<script src="vendor/xterm/xterm.js"></script>
<script src="vendor/xterm/addon-fit.js"></script>
<script src="vendor/xterm/addon-search.js"></script>
<script src="vendor/xterm/addon-web-links.js"></script>
<script src="term.js"></script>
<script src="page.js"></script>
<script src="dock.js"></script>
<script src="arrange.js"></script>
<script src="beside.js"></script>
<script src="wsbg.js"></script>
<script src="nav.js"></script>
<script src="overview.js"></script>
<script src="groups.js"></script>
<script src="teams.js"></script>
<script src="notes-merge.js"></script>
<script src="notes.js"></script>
<script src="files.js"></script>
<script src="sidebar.js"></script>
<script src="app.js"></script>
</body>
</html>

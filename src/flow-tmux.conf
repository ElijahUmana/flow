# Flow's tmux configuration. Loaded with -f by every tmux call on Flow's own socket, so it is
# applied when Flow starts its tmux server. It never touches the user's own tmux setup.
# It is also sourced into a server that may have run for days under an older version of this file, so every line
# must give the same result however often it runs: arrays are reset before appending, old hooks are removed.

set -g default-terminal "xterm-256color"
set -su terminal-overrides
set -as terminal-overrides ",xterm-256color:Tc"
set -su terminal-features
set -as terminal-features ",xterm-256color:RGB:hyperlinks:title:focus:clipboard"

set -g mouse on
set -g status off
set -g history-limit 50000
set -sg escape-time 0
# Off: tmux 3.4 and 3.6 pass a terminal's focus in and out through the copy-mode key tables, where the Any binding below
# took them for typing and ended the scrollback, so a terminal scrolled back jumped to the bottom whenever another took
# the keys. FocusIn and FocusOut cannot be bound by name to keep them out of Any.
set -g focus-events off
set -g window-size latest
setw -g aggressive-resize on
set -g detach-on-destroy on
set -g base-index 0
setw -g pane-base-index 0

# Claude Code sets its title with OSC 0/2 inside the pane; tmux forwards the active pane's title
# to the outer terminal (xterm.js onTitleChange). tmux titles a new pane with the host name; that is
# sent as an empty title, so Flow shows its own label until a program sets one.
set -g set-titles on
set -g set-titles-string "#{?#{==:#{pane_title},#{host}},,#T}"
setw -g allow-rename on
# -q: allow-set-title only exists from tmux 3.5; on older tmux an unknown option would show the
# config error over every new terminal and swallow the first keystrokes.
setw -gq allow-set-title on

# Copy mode is only the scrollback the wheel opens and the mouse selects in. Its keyboard bindings are removed and any
# key leaves it and reaches the program, as typing does in a terminal app after scrolling back. A bracketed paste skips
# key tables, so term.js sends User0 before each paste: it leaves copy mode, and does nothing (reaches no program)
# otherwise. The mouse bindings below restore tmux's own, with Flow's changes.
unbind -a -T copy-mode
unbind -a -T copy-mode-vi
bind -T copy-mode    Any send -X cancel \; send-keys
bind -T copy-mode-vi Any send -X cancel \; send-keys
set -s user-keys[0] "\e[59999~"
bind -n User0 if -F "#{pane_in_mode}" "send -X cancel"
bind -T copy-mode    User0 send -X cancel
bind -T copy-mode-vi User0 send -X cancel
bind -T copy-mode    MouseDown1Pane select-pane
bind -T copy-mode-vi MouseDown1Pane select-pane
bind -T copy-mode    MouseDrag1Pane select-pane \; send -X begin-selection
bind -T copy-mode-vi MouseDrag1Pane select-pane \; send -X begin-selection
bind -T copy-mode    DoubleClick1Pane select-pane \; send -X select-word \; run -d 0.3 \; send -X copy-pipe-and-cancel
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; run -d 0.3 \; send -X copy-pipe-and-cancel
bind -T copy-mode    TripleClick1Pane select-pane \; send -X select-line \; run -d 0.3 \; send -X copy-pipe-and-cancel
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; run -d 0.3 \; send -X copy-pipe-and-cancel
# A click in a terminal scrolled back keeps it there: a release, a second click or another button, left unbound here,
# would reach Any above and end the scrollback.
bind -T copy-mode    MouseUp1Pane     select-pane
bind -T copy-mode-vi MouseUp1Pane     select-pane
bind -T copy-mode    SecondClick1Pane select-pane
bind -T copy-mode-vi SecondClick1Pane select-pane
bind -T copy-mode    MouseDown2Pane   select-pane
bind -T copy-mode-vi MouseDown2Pane   select-pane
bind -T copy-mode    MouseUp2Pane     select-pane
bind -T copy-mode-vi MouseUp2Pane     select-pane
bind -T copy-mode    MouseDown3Pane   select-pane
bind -T copy-mode-vi MouseDown3Pane   select-pane

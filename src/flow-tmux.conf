# Flow's tmux configuration. Loaded with -f by every tmux call on Flow's own socket, so it is
# applied when Flow starts its tmux server. It never touches the user's own tmux setup.
# It is also sourced into a server that may have run for days under an older version of this file, so every line
# must give the same result however often it runs: arrays are reset before appending, old hooks are removed.

set -g default-terminal "xterm-256color"
set -su terminal-overrides
set -as terminal-overrides ",xterm-256color:Tc"
set -su terminal-features
set -as terminal-features ",xterm-256color:RGB:hyperlinks:title:focus:clipboard"

set -g mouse on
set -g status off
set -g history-limit 50000
set -sg escape-time 0
# Off: tmux 3.4 and 3.6 pass a terminal's focus in and out through the copy-mode key tables, where the Any binding below
# took them for typing and ended the scrollback, so a terminal scrolled back jumped to the bottom whenever another took
# the keys. FocusIn and FocusOut cannot be bound by name to keep them out of Any.
set -g focus-events off
set -g window-size latest
setw -g aggressive-resize on
set -g detach-on-destroy on
set -g base-index 0
setw -g pane-base-index 0

# Claude Code sets its title with OSC 0/2 inside the pane; tmux forwards the active pane's title
# to the outer terminal (xterm.js onTitleChange). tmux titles a new pane with the host name; that is
# sent as an empty title, so Flow shows its own label until a program sets one.
set -g set-titles on
set -g set-titles-string "#{?#{==:#{pane_title},#{host}},,#T}"
setw -g allow-rename on
# -q: allow-set-title only exists from tmux 3.5; on older tmux an unknown option would show the
# config error over every new terminal and swallow the first keystrokes.
setw -gq allow-set-title on

# Copy mode is only the scrollback the wheel opens and the mouse selects in. Its keyboard bindings are removed and any
# key leaves it and reaches the program, as typing does in a terminal app after scrolling back. A bracketed paste skips
# key tables, so term.js sends User0 before each paste: it leaves copy mode, and does nothing (reaches no program)
# otherwise. The mouse bindings below restore tmux's own, with Flow's changes.
unbind -a -T copy-mode
unbind -a -T copy-mode-vi
bind -T copy-mode    Any send -X cancel \; send-keys
bind -T copy-mode-vi Any send -X cancel \; send-keys
set -s user-keys[0] "\e[59999~"
bind -n User0 if -F "#{pane_in_mode}" "send -X cancel"
bind -T copy-mode    User0 send -X cancel
bind -T copy-mode-vi User0 send -X cancel
bind -T copy-mode    MouseDown1Pane select-pane
bind -T copy-mode-vi MouseDown1Pane select-pane
bind -T copy-mode    MouseDrag1Pane select-pane \; send -X begin-selection
bind -T copy-mode-vi MouseDrag1Pane select-pane \; send -X begin-selection
bind -T copy-mode    DoubleClick1Pane select-pane \; send -X select-word \; run -d 0.3 \; send -X copy-pipe-and-cancel
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; run -d 0.3 \; send -X copy-pipe-and-cancel
bind -T copy-mode    TripleClick1Pane select-pane \; send -X select-line \; run -d 0.3 \; send -X copy-pipe-and-cancel
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; run -d 0.3 \; send -X copy-pipe-and-cancel
# A click in a terminal scrolled back keeps it there: a release, a second click or another button, left unbound here,
# would reach Any above and end the scrollback.
bind -T copy-mode    MouseUp1Pane     select-pane
bind -T copy-mode-vi MouseUp1Pane     select-pane
bind -T copy-mode    SecondClick1Pane select-pane
bind -T copy-mode-vi SecondClick1Pane select-pane
bind -T copy-mode    MouseDown2Pane   select-pane
bind -T copy-mode-vi MouseDown2Pane   select-pane
bind -T copy-mode    MouseUp2Pane     select-pane
bind -T copy-mode-vi MouseUp2Pane     select-pane
bind -T copy-mode    MouseDown3Pane   select-pane
bind -T copy-mode-vi MouseDown3Pane   select-pane
bind -T copy-mode    MouseUp3Pane     select-pane
bind -T copy-mode-vi MouseUp3Pane     select-pane

# Copy: a drag selects in copy mode and releasing copies. tmux hands every copy to the outer terminal as OSC 52
# (set-clipboard external), which term.js writes to the Mac's clipboard: the same on the Mac and on Flow's tmux on the
# VM, where there is no pbcopy.
set -su copy-command
set -s set-clipboard external
setw -g mode-style "bg=#3d3d42,fg=default"
# ⌘F (term.js) finds through copy mode: its matches in term.js's find colors, the current one orange
setw -g copy-mode-match-style "bg=#4a3128,fg=default"
setw -g copy-mode-current-match-style "bg=#d77757,fg=#0c0c0c"
# With mode-keys emacs (tmux's default unless EDITOR or VISUAL names vi) a selection leaves out the cell at its far end,
# so a drag released on a word's last letter lost that letter. On release the far end steps one cell on, and back if
# that wrapped to the next line (the end was past the text); never at column 0 of an empty line, where it cannot step.
# It runs deferred (run -b), without the mouse event: in a mouse binding tmux puts the copy-mode cursor back under the
# pointer before every command.
bind -T copy-mode    MouseDragEnd1Pane run -b -C {
  if -F "#{||:#{e|<:#{selection_end_y},#{selection_start_y}},#{&&:#{==:#{selection_end_y},#{selection_start_y}},#{e|<:#{selection_end_x},#{selection_start_x}}}}" { send -X other-end }
  if -F "#{||:#{copy_cursor_x},#{copy_cursor_line}}" {
    send -X cursor-right
    if -F "#{==:#{copy_cursor_x},0}" { send -X cursor-left }
  }
  send -X copy-pipe-and-cancel
}
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# Right-click is Flow's own menu (fork, copy resume command). tmux's default opens its pane menu (Kill, Respawn,
# splits) inside a terminal whose program has no mouse mode; unbound, the click still reaches a program that has one.
unbind -n MouseDown3Pane
unbind -n M-MouseDown3Pane

# One line per wheel report: xterm.js sends a report per line of trackpad delta.
bind -T copy-mode    WheelUpPane   select-pane \; send -X -N 1 scroll-up
bind -T copy-mode    WheelDownPane select-pane \; send -X -N 1 scroll-down
bind -T copy-mode-vi WheelUpPane   select-pane \; send -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send -X -N 1 scroll-down
# tmux's own bindings for scrolling back and for a drag where the program has no mouse mode, with -H: without it tmux
# draws its line counter ("[7/481]") at the pane's top right for as long as the terminal is scrolled back.
bind -n WheelUpPane    if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode -e -H }
bind -n MouseDrag1Pane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send -M } { copy-mode -M -H }

# Pane borders: thin and dark, the active one Claude orange. Pane titles sit in the top border
# only while a window has two or more panes (agent-team teammates show by name). A pane still titled with the host
# name, as tmux titles every new pane, shows none, as in set-titles-string above.
setw -g pane-border-lines single
setw -g pane-border-indicators off
setw -g pane-border-style "fg=#2a2a2e"
setw -g pane-active-border-style "fg=#d97757"
setw -g pane-border-format "#{?#{==:#{pane_title},#{host}},, #{pane_title} }"
setw -g pane-border-status off

# When a pane exits or is killed, tmux runs hooks with another window as their format context (the
# most recently used session's); only #{hook_window} names the window that changed. So the pane count
# is read for that window by scanning every window (S: and W: loops), which also skips windows that are
# already gone: targeting a destroyed window would flash "No such window" in another terminal. ## keeps
# a format for the second expansion. This one hook covers split, exit and kill.
set-hook -gu after-split-window
set-hook -gu after-kill-pane
set-hook -gw window-layout-changed {
  run-shell -C "if -F '##{S:##{W:##{?##{==:##{window_id},#{hook_window}},1,}}}' 'set -wF -t #{hook_window} pane-border-status \"##{?##{e|>:##{S:##{W:##{?##{==:##{window_id},#{hook_window}},##{window_panes},}}},1},top,off}\"'"
}





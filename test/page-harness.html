<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; font-src 'self' data:; connect-src 'self'">
<title>flow page harness</title>
<style>
:root{--side:#151517;--line:#26262a;--text:#e9e9ec;--dim:#8d8d93;--faint:#5d5d63;--win:#0f0f11;--bar1:#242428;--bar2:#1c1c1f;--mono:"SF Mono",ui-monospace,Menlo,Monaco,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0b0d;color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
#grid{position:fixed;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;padding:12px;background:radial-gradient(1100px 650px at 18% 8%, #2b2444 0%, transparent 62%), radial-gradient(900px 600px at 92% 95%, #3b2236 0%, transparent 60%), #141319}
.win{position:relative;display:flex;flex-direction:column;border-radius:10px;background:var(--win);border:1px solid #2a2a2e;box-shadow:0 20px 55px rgba(0,0,0,.5);overflow:hidden;min-width:0;min-height:0}
.tb{height:30px;flex:none;display:flex;align-items:center;padding:0 10px;background:linear-gradient(var(--bar1),var(--bar2));border-bottom:1px solid #29292d;user-select:none;gap:10px}
.lights{display:flex;gap:7px;flex:none}
.lights i{width:11px;height:11px;border-radius:50%;background:#3b3b40}
.win.front>.tb .lights i:nth-child(1){background:#ff5f57}
.win.front>.tb .lights i:nth-child(2){background:#febc2e}
.win.front>.tb .lights i:nth-child(3){background:#28c840}
.tb .title{flex:1;text-align:center;font-size:12px;color:#bfbfc4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb .act{flex:none;width:47px}
[contenteditable]{outline:none;min-height:1.4em;cursor:text}
[contenteditable]:empty::before{content:attr(data-ph);color:var(--faint)}
.pn{flex:1;display:flex;flex-direction:column;min-height:0;background:#141416}
.ptitle{flex:none;font-size:15px;font-weight:700;color:#f0f0f2;padding:12px 16px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgc{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.pnote{flex:none;height:22%;min-height:54px;padding:10px 16px;font-size:12.5px;line-height:1.6;color:#d9d9dd;overflow:auto;white-space:pre-wrap}
.win:not(.front) .pgv::after,body.busy .pgv::after{content:"";position:absolute;inset:0;z-index:2}
body.busy webview{pointer-events:none}
</style>
<link rel="stylesheet" href="../src/page.css">
</head>
<body>
<div id="grid"></div>
<script src="../src/page.js"></script>
<script src="page-harness.js"></script>
</body>
</html>
